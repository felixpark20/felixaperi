/* ============================================
   이생 — Magazine base styles
   ============================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1c1b18;
  font-family: var(--font-body);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#root { width: 100%; height: 100%; }

/* ============================================
   PALETTES — toggled via [data-palette] on body
   ============================================ */

body[data-palette="sand"] {
  --bg: #FAF7F2;
  --bg-soft: #F2EDE3;
  --bg-deep: #ECE3D2;
  --ink: #2C2A26;
  --ink-soft: #5b574e;
  --accent: #D97757;
  --accent-soft: #E8B96B;
  --rule: #2C2A26;
  --paper-shadow: 0 30px 80px -30px rgba(60,40,20,.35);
}

body[data-palette="stone"] {
  --bg: #FFFFFF;
  --bg-soft: #F4F2EE;
  --bg-deep: #E8E4DD;
  --ink: #1A1A1A;
  --ink-soft: #6b6760;
  --accent: #1A1A1A;
  --accent-soft: #A89F8E;
  --rule: #1A1A1A;
  --paper-shadow: 0 30px 80px -30px rgba(0,0,0,.25);
}

body[data-palette="mint"] {
  --bg: #F4F8FB;
  --bg-soft: #E7F0F5;
  --bg-deep: #D5E7EE;
  --ink: #1F3340;
  --ink-soft: #557184;
  --accent: #2F7FA8;
  --accent-soft: #B9DCC9;
  --rule: #1F3340;
  --paper-shadow: 0 30px 80px -30px rgba(20,60,90,.30);
}

/* ============================================
   TYPE PAIRINGS — toggled via [data-type] on body
   ============================================ */

body[data-type="editorial"] {
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
  --font-label: "Pretendard", sans-serif;
  --display-leading: 1.08;
  --display-tracking: -0.02em;
}

body[data-type="modern"] {
  --font-display: "Pretendard", "Noto Sans KR", sans-serif;
  --font-body: "Pretendard", "Noto Sans KR", sans-serif;
  --font-label: "IBM Plex Mono", monospace;
  --display-leading: 1.0;
  --display-tracking: -0.04em;
}

body[data-type="playful"] {
  --font-display: "Gowun Dodum", "Noto Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Noto Sans KR", sans-serif;
  --font-label: "IBM Plex Mono", monospace;
  --display-leading: 1.05;
  --display-tracking: -0.01em;
}

/* ============================================
   PAGE / SPREAD SHELL
   ============================================ */

.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #1c1b18;
  overflow: hidden;
}

.spread-wrap {
  position: relative;
  width: min(95vw, calc(95vh * 1.6));
  aspect-ratio: 1.6 / 1;
  background: var(--bg);
  color: var(--ink);
  box-shadow: var(--paper-shadow);
  overflow: hidden;
  transition: background-color .4s ease, color .4s ease;
}

.spread {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--bg);
  color: var(--ink);
}

/* center gutter line */
.spread::before {
  content: "";
  position: absolute;
  top: 6%;
  bottom: 6%;
  left: 50%;
  width: 1px;
  background: color-mix(in oklab, var(--ink) 8%, transparent);
  pointer-events: none;
}

.page {
  position: relative;
  padding: 5.5% 5.5%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.page.no-pad { padding: 0; }

/* page number / footer */
.page-foot {
  position: absolute;
  bottom: 18px;
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 5.5%;
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* ============================================
   TYPOGRAPHY ATOMS
   ============================================ */

.eyebrow {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.eyebrow.accent { color: var(--accent); }

.kicker {
  font-family: var(--font-label);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
  font-weight: 600;
}

.display {
  font-family: var(--font-display);
  font-weight: 700;
  line-height: var(--display-leading);
  letter-spacing: var(--display-tracking);
  color: var(--ink);
}

.body-serif, .body {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.75;
  color: var(--ink);
  text-wrap: pretty;
}

.dropcap::first-letter {
  font-family: var(--font-display);
  font-size: 4.5em;
  float: left;
  line-height: 0.9;
  padding: 4px 8px 0 0;
  color: var(--accent);
  font-weight: 700;
}

.rule {
  height: 1px;
  background: var(--rule);
  width: 100%;
}

.rule.thick { height: 3px; }

.col-2 {
  column-count: 2;
  column-gap: 24px;
  column-rule: 1px solid color-mix(in oklab, var(--ink) 10%, transparent);
}

/* ============================================
   NAV CHROME
   ============================================ */

.nav-chrome {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  background: rgba(28,27,24,.85);
  backdrop-filter: blur(20px);
  border-radius: 999px;
  color: #f5f2ec;
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 12px;
  letter-spacing: 0.06em;
  z-index: 50;
  user-select: none;
}

.nav-chrome button {
  appearance: none;
  background: rgba(255,255,255,.08);
  border: none;
  color: inherit;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background .15s ease;
}
.nav-chrome button:hover { background: rgba(255,255,255,.18); }
.nav-chrome button:disabled { opacity: .35; cursor: default; }

.nav-chrome .dots {
  display: flex;
  gap: 6px;
  padding: 0 6px;
}
.nav-chrome .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,.25);
  transition: all .2s ease;
  cursor: pointer;
}
.nav-chrome .dot.active {
  background: #f5f2ec;
  width: 18px;
  border-radius: 4px;
}

.nav-chrome .count {
  font-variant-numeric: tabular-nums;
  opacity: .7;
  min-width: 40px;
  text-align: center;
}

/* ============================================
   PAGE-FLIP ANIMATION
   ============================================ */

.flip-stage {
  position: relative;
  width: 100%;
  height: 100%;
  perspective: 2400px;
}

.spread-layer {
  position: absolute;
  inset: 0;
  transform-origin: center center;
  will-change: transform, opacity;
}

@keyframes flip-in-right {
  from { transform: translateX(8%) scale(.98); opacity: 0; }
  to   { transform: translateX(0) scale(1); opacity: 1; }
}
@keyframes flip-in-left {
  from { transform: translateX(-8%) scale(.98); opacity: 0; }
  to   { transform: translateX(0) scale(1); opacity: 1; }
}
@keyframes flip-out-left {
  from { transform: translateX(0) scale(1); opacity: 1; }
  to   { transform: translateX(-8%) scale(.98); opacity: 0; }
}
@keyframes flip-out-right {
  from { transform: translateX(0) scale(1); opacity: 1; }
  to   { transform: translateX(8%) scale(.98); opacity: 0; }
}

.flip-enter-fwd { animation: flip-in-right .55s cubic-bezier(.7,0,.2,1) both; }
.flip-enter-bwd { animation: flip-in-left  .55s cubic-bezier(.7,0,.2,1) both; }
.flip-exit-fwd  { animation: flip-out-left  .55s cubic-bezier(.7,0,.2,1) both; }
.flip-exit-bwd  { animation: flip-out-right .55s cubic-bezier(.7,0,.2,1) both; }

/* Page curl shadow during flip */
.curl-shadow {
  position: absolute;
  top: 0; bottom: 0;
  width: 60px;
  pointer-events: none;
  z-index: 5;
}
.curl-shadow.right {
  right: 50%;
  background: linear-gradient(to left, rgba(0,0,0,.18), transparent);
}

/* ============================================
   IMAGE WELL
   ============================================ */

.img-well {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--bg-deep);
  overflow: hidden;
}
.img-well img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.img-well .caption {
  position: absolute;
  bottom: 12px; left: 12px; right: 12px;
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,.4);
}

/* ============================================
   COVER-specific
   ============================================ */

.cover-mast {
  font-family: var(--font-display);
  font-weight: 800;
  line-height: 0.85;
  letter-spacing: -0.04em;
  color: var(--ink);
  font-size: clamp(80px, 14vw, 240px);
}

.cover-bar {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-top: 2px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  padding: 8px 0;
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

/* ============================================
   TOC
   ============================================ */

.toc-row {
  display: grid;
  grid-template-columns: 56px 1fr 60px;
  align-items: baseline;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid color-mix(in oklab, var(--ink) 15%, transparent);
}
.toc-row:last-child { border-bottom: none; }
.toc-row .num {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--accent);
}
.toc-row .ttl {
  font-family: var(--font-display);
  font-size: 18px;
  line-height: 1.25;
  color: var(--ink);
}
.toc-row .ttl small {
  display: block;
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 2px;
  letter-spacing: 0;
}
.toc-row .pg {
  font-family: var(--font-label);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-align: right;
  color: var(--ink-soft);
}

/* ============================================
   QUOTE PULL
   ============================================ */

.pull-quote {
  font-family: var(--font-display);
  font-size: 28px;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--accent);
  padding: 16px 0;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  margin: 20px 0;
}

/* ============================================
   NUMBERS / DATA piece
   ============================================ */

.stat-card {
  border-top: 1px solid var(--ink);
  padding: 14px 0 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-card .num {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 56px;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--ink);
}
.stat-card .num .unit {
  font-size: 22px;
  color: var(--accent);
  margin-left: 4px;
}
.stat-card .lbl {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.stat-card .desc {
  font-size: 12px;
  color: var(--ink);
  line-height: 1.5;
  margin-top: 4px;
}

/* ============================================
   Q&A
   ============================================ */

.qa { display: flex; flex-direction: column; gap: 14px; }
.qa .q {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  line-height: 1.4;
  color: var(--accent);
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 8px;
}
.qa .q::before {
  content: "Q";
  font-family: var(--font-label);
  font-weight: 700;
  font-size: 14px;
  color: var(--accent);
}
.qa .a {
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink);
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.qa .a::before {
  content: "A";
  font-family: var(--font-label);
  font-weight: 700;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 0.1em;
}

/* ============================================
   misc helpers
   ============================================ */

.tag {
  display: inline-block;
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 4px 10px;
  border: 1px solid var(--ink);
  color: var(--ink);
  border-radius: 999px;
}
.tag.accent {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}

.grid-photos {
  display: grid;
  gap: 8px;
}

.swatch-stack {
  display: flex;
  gap: 4px;
}
.swatch-stack span {
  width: 18px; height: 18px; border-radius: 50%;
  display: block;
}

</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

            color: "var(--ink-soft)",

}

/* ===========================================
   Spread registry
   =========================================== */
const SPREADS = [
  { id: "cover",     label: "COVER",       Comp: CoverSpread },
  { id: "toc",       label: "CONTENTS",    Comp: TocSpread },
  { id: "editor",    label: "EDITOR",      Comp: EditorSpread },
  { id: "ai",        label: "AI",          Comp: AiFeatureSpread },
  { id: "photo",     label: "PHOTO",       Comp: PhotoEssaySpread },
  { id: "interview", label: "INTERVIEW",   Comp: InterviewSpread },
  { id: "numbers",   label: "NUMBERS",     Comp: NumbersSpread },
  { id: "back",      label: "NEXT",        Comp: BackSpread },
];

Object.assign(window, { SPREADS });

</script>
  <script type="text/babel">
/* ===========================================
   이생 — App shell
   =========================================== */

const { useState, useEffect, useRef, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "sand",
  "typePair": "editorial"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [index, setIndex] = useState(0);
  const [direction, setDirection] = useState("fwd");
  const [exitingIdx, setExitingIdx] = useState(null);
  const animTimer = useRef(null);

  useEffect(() => {
    document.body.dataset.palette = t.palette;
    document.body.dataset.type = t.typePair;
  }, [t.palette, t.typePair]);

  const total = SPREADS.length;

  const go = useCallback((nextRaw) => {
    setIndex((cur) => {
      const next = Math.max(0, Math.min(total - 1, nextRaw));
      if (next === cur) return cur;
      setDirection(next > cur ? "fwd" : "bwd");
      setExitingIdx(cur);
      clearTimeout(animTimer.current);
      animTimer.current = setTimeout(() => setExitingIdx(null), 550);
      return next;
    });
  }, [total]);

  const next = useCallback(() => go(index + 1), [go, index]);
  const prev = useCallback(() => go(index - 1), [go, index]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
      else if (e.key === "Home") { go(0); }
      else if (e.key === "End") { go(total - 1); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [next, prev, go, total]);

  const touchStart = useRef(null);
  const onTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStart.current == null) return;
    const dx = e.changedTouches[0].clientX - touchStart.current;
    if (Math.abs(dx) > 50) (dx < 0 ? next : prev)();
    touchStart.current = null;
  };

  const wheelLock = useRef(0);
  const onWheel = (e) => {
    const now = Date.now();
    if (now - wheelLock.current < 700) return;
    if (Math.abs(e.deltaX) < 30 && Math.abs(e.deltaY) < 30) return;
    wheelLock.current = now;
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    (delta > 0 ? next : prev)();
  };

  return (
    <React.Fragment>
      <div className="stage"
           onTouchStart={onTouchStart}
           onTouchEnd={onTouchEnd}
           onWheel={onWheel}>
        <div className="spread-wrap"
             data-screen-label={`${String(index + 1).padStart(2, "0")} ${SPREADS[index].label}`}>
          <div className="flip-stage">
            {exitingIdx != null && (() => {
              const ExitComp = SPREADS[exitingIdx].Comp;
              const exitClass = direction === "fwd" ? "flip-exit-fwd" : "flip-exit-bwd";
              return (
                <div className={"spread-layer " + exitClass} key={"exit-" + exitingIdx}>
                  <ExitComp />
                </div>
              );
            })()}
            {(() => {
              const Comp = SPREADS[index].Comp;
              const enterClass = direction === "fwd" ? "flip-enter-fwd" : "flip-enter-bwd";
              return (
                <div className={"spread-layer " + enterClass} key={"in-" + index}>
                  <Comp />
                </div>
              );
            })()}
          </div>
        </div>
      </div>

      <div className="nav-chrome">
        <button onClick={prev} disabled={index === 0} aria-label="previous">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <div className="dots">
          {SPREADS.map((s, i) => (
            <span key={s.id}
                  className={"dot" + (i === index ? " active" : "")}
                  title={s.label}
                  onClick={() => go(i)} />
          ))}
        </div>
        <span className="count">{String(index + 1).padStart(2, "0")} / {String(total).padStart(2, "0")}</span>
        <button onClick={next} disabled={index === total - 1} aria-label="next">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Palette" />
        <TweakRadio
          label="Color"
          value={t.palette}
          options={[
            { value: "sand",  label: "Sand" },
            { value: "stone", label: "Stone" },
            { value: "mint",  label: "Mint" },
          ]}
          onChange={(v) => setTweak("palette", v)}
        />

        <TweakSection label="Typography" />
        <TweakRadio
          label="Pairing"
          value={t.typePair}
          options={[
            { value: "editorial", label: "Editorial" },
            { value: "modern",    label: "Modern" },
            { value: "playful",   label: "Playful" },
          ]}
          onChange={(v) => setTweak("typePair", v)}
        />

        <TweakSection label="Jump to spread" />
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, padding: "2px 14px 12px" }}>
          {SPREADS.map((s, i) => (
            <button key={s.id}
                    onClick={() => go(i)}
                    style={{
                      appearance: "none",
                      background: i === index ? "rgba(0,0,0,.08)" : "rgba(0,0,0,.02)",
                      color: "#29261b",
                      border: "1px solid rgba(0,0,0,.08)",
                      borderRadius: 6,
                      padding: "7px 10px",
                      fontFamily: "ui-sans-serif, system-ui",
                      fontSize: 11,
                      letterSpacing: "0.06em",
                      textAlign: "left",
                      cursor: "pointer",
                    }}>
              <div style={{ opacity: 0.45, fontSize: 9, marginBottom: 1 }}>{String(i + 1).padStart(2, "0")}</div>
              {s.label}
            </button>
          ))}
        </div>
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
